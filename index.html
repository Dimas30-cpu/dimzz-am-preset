<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preset Hunter</title>

<script src="config.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,rgba(116,70,255,.20),transparent 35%),
    radial-gradient(circle at 80% 90%,rgba(0,220,255,.15),transparent 35%),
    #050509;
  padding:25px 14px 50px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:2px;
  background:linear-gradient(90deg,#a56cff,#00e5ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  margin-top:7px;
  color:#9a9aa8;
  font-size:14px;
}

.card{
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.045);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:22px;
  padding:20px;
  box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.input-wrap{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  border-radius:14px;
  padding:16px;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:14px;
  border:1px solid rgba(255,255,255,.08);
}

input::placeholder{
  color:#777783;
}

button{
  border:none;
  cursor:pointer;
  color:#fff;
  border-radius:14px;
  font-weight:800;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.scan-btn{
  padding:0 22px;
  background:linear-gradient(135deg,#7546ff,#00c9ff);
  min-height:52px;
}

.scan-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.progress{
  display:none;
  margin-top:20px;
}

.progress.show{
  display:block;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:13px;
}

.progress-title{
  font-weight:800;
}

.progress-percent{
  color:#00d9ff;
}

.bar{
  height:8px;
  background:rgba(255,255,255,.08);
  border-radius:20px;
  overflow:hidden;
}

.bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7849ff,#00e5ff);
  border-radius:20px;
  transition:.35s;
}

.steps{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-top:14px;
}

.step{
  text-align:center;
  padding:8px 4px;
  border-radius:10px;
  background:rgba(255,255,255,.035);
  color:#656572;
  font-size:10px;
  font-weight:800;
}

.step.active{
  color:#fff;
  background:rgba(112,75,255,.18);
}

.step.done{
  color:#00e5ff;
}

.status{
  margin-top:14px;
  font-size:12px;
  color:#858592;
  line-height:1.6;
}

.error{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:rgba(255,60,90,.10);
  border:1px solid rgba(255,60,90,.25);
  color:#ff8c9d;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
}

.error.show{
  display:block;
}

.result{
  display:none;
  margin-top:20px;
}

.result.show{
  display:block;
}

.video-card{
  display:grid;
  grid-template-columns:180px 1fr;
  gap:18px;
  padding:15px;
  border-radius:18px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}

.video-box{
  width:180px;
  aspect-ratio:9/16;
  background:#000;
  border-radius:14px;
  overflow:hidden;
}

.video-box video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info h2{
  font-size:20px;
  margin-bottom:8px;
  word-break:break-word;
}

.username{
  color:#9f9fa9;
  margin-bottom:13px;
}

.caption{
  color:#c8c8d0;
  line-height:1.55;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.stat{
  background:rgba(255,255,255,.06);
  border-radius:9px;
  padding:7px 9px;
  color:#aaaab4;
  font-size:11px;
}

.download{
  display:inline-block;
  margin-top:14px;
  padding:10px 13px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  background:rgba(0,220,255,.12);
  border:1px solid rgba(0,220,255,.20);
  font-size:12px;
  font-weight:800;
}

.section{
  margin-top:20px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.section-title h3{
  font-size:15px;
}

.badge{
  font-size:10px;
  padding:5px 8px;
  border-radius:8px;
  background:rgba(0,220,255,.10);
  color:#00dfff;
}

.preset-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.preset{
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}

.preset-top{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.preset-number{
  min-width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:linear-gradient(135deg,#7446ff,#00cfff);
  font-size:11px;
  font-weight:900;
}

.preset-body{
  min-width:0;
  flex:1;
}

.preset-name{
  font-weight:800;
  font-size:13px;
  margin-bottom:5px;
  word-break:break-word;
}

.preset-source{
  color:#81818c;
  font-size:10px;
  line-height:1.5;
  word-break:break-word;
}

.preset-url{
  margin-top:7px;
  font-size:10px;
  color:#00dfff;
  word-break:break-all;
}

.preset-actions{
  display:flex;
  gap:7px;
  margin-top:11px;
  flex-wrap:wrap;
}

.action{
  padding:8px 10px;
  background:rgba(255,255,255,.07);
  font-size:10px;
}

.action.open{
  background:rgba(0,220,255,.12);
}

.comments-info{
  color:#898995;
  font-size:11px;
  line-height:1.6;
}

.empty{
  padding:20px;
  text-align:center;
  color:#777783;
  border:1px dashed rgba(255,255,255,.10);
  border-radius:14px;
  font-size:12px;
}

.debug{
  margin-top:18px;
  padding:12px;
  border-radius:12px;
  background:#020204;
  border:1px solid rgba(255,255,255,.06);
  color:#73737d;
  font-size:10px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  display:none;
}

.debug.show{
  display:block;
}

@media(max-width:650px){

  body{
    padding:16px 10px 35px;
  }

  .logo{
    font-size:30px;
  }

  .input-wrap{
    flex-direction:column;
  }

  .scan-btn{
    width:100%;
  }

  .video-card{
    grid-template-columns:1fr;
  }

  .video-box{
    width:100%;
    max-width:250px;
    margin:auto;
  }

  .steps{
    grid-template-columns:repeat(5,1fr);
  }

  .step{
    font-size:8px;
  }
}
</style>

<script>

/* =========================================================
   STATE
========================================================= */

const state = {

  comments: [],

  replies: [],

  allTexts: [],

  presets: [],

  videoData: null,

  originalUrl: ""

};


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   CONFIG CHECK
========================================================= */

function getConfig(){

  /*
   * config.js menggunakan:
   *
   * const CONFIG = {...}
   *
   * Karena script config.js dipanggil sebelum
   * script ini, CONFIG bisa langsung digunakan.
   */

  if(
    typeof CONFIG === "undefined"
  ){

    throw new Error(
      "config.js tidak ditemukan atau CONFIG belum didefinisikan."
    );

  }

  return CONFIG;
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


function formatNumber(value){

  const n =
    Number(value || 0);

  if(!Number.isFinite(n)){
    return "0";
  }

  if(n >= 1000000000){

    return (
      n / 1000000000
    ).toFixed(1) + "B";

  }

  if(n >= 1000000){

    return (
      n / 1000000
    ).toFixed(1) + "M";

  }

  if(n >= 1000){

    return (
      n / 1000
    ).toFixed(1) + "K";

  }

  return String(n);
}


function normalizeText(value){

  return String(value || "")
    .replace(/\s+/g, " ")
    .trim();
}


function sleep(ms){

  return new Promise(
    resolve => setTimeout(resolve, ms)
  );

}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
  percent,
  title,
  status
){

  $("progress")
    .classList.add("show");

  const safePercent =
    Math.max(
      0,
      Math.min(100, percent)
    );

  $("barFill").style.width =
    safePercent + "%";

  $("progressPercent").textContent =
    safePercent + "%";

  $("progressTitle").textContent =
    title;

  $("statusText").textContent =
    status;

}


function activateStep(name){

  const steps = [

    "Video",
    "Comments",
    "Replies",
    "Scan",
    "Done"

  ];

  const index =
    steps.indexOf(name);

  steps.forEach(
    (step, i) => {

      const el =
        $("step" + step);

      if(!el){
        return;
      }

      el.classList.remove(
        "active"
      );

      if(i < index){

        el.classList.add(
          "done"
        );

      }else{

        el.classList.remove(
          "done"
        );

      }

    }
  );

  const current =
    $("step" + name);

  if(current){

    current.classList.add(
      "active"
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  const box =
    $("errorBox");

  box.textContent =
    message;

  box.classList.add(
    "show"
  );

}


function clearError(){

  $("errorBox")
    .classList.remove(
      "show"
    );

  $("errorBox")
    .textContent = "";

}


/* =========================================================
   TIKTOK URL
========================================================= */

function isTikTokUrl(url){

  try{

    const parsed =
      new URL(url);

    const host =
      parsed.hostname
        .toLowerCase()
        .replace(/^www\./, "");

    return (

      host === "tiktok.com" ||

      host.endsWith(
        ".tiktok.com"
      )

    );

  }catch{

    return false;

  }

}


/* =========================================================
   RAPIDAPI
========================================================= */

async function fetchTikTokVideo(url){

  const config =
    getConfig();


  if(
    !config.RAPIDAPI_KEY ||
    config.RAPIDAPI_KEY.includes(
      "PASTE_"
    ) ||
    config.RAPIDAPI_KEY.includes(
      "ISI_"
    )
  ){

    throw new Error(
      "RAPIDAPI_KEY belum diisi di config.js."
    );

  }


  if(
    !config.RAPIDAPI_HOST
  ){

    throw new Error(
      "RAPIDAPI_HOST belum diisi di config.js."
    );

  }


  const endpoint =

    "https://" +

    config.RAPIDAPI_HOST +

    "/vid/index?url=" +

    encodeURIComponent(url);


  let response;

  try{

    response =
      await fetch(
        endpoint,
        {

          method: "GET",

          headers: {

            "X-RapidAPI-Key":
              config.RAPIDAPI_KEY,

            "X-RapidAPI-Host":
              config.RAPIDAPI_HOST

          }

        }
      );

  }catch(error){

    throw new Error(
      "Tidak bisa menghubungi RapidAPI. " +
      "Kemungkinan CORS atau koneksi API."
    );

  }


  if(!response.ok){

    let detail = "";

    try{

      detail =
        await response.text();

    }catch(e){}

    throw new Error(

      "RapidAPI HTTP " +

      response.status +

      " - " +

      (
        detail ||
        response.statusText
      )

    );

  }


  try{

    return await response.json();

  }catch{

    throw new Error(
      "Response RapidAPI bukan JSON yang valid."
    );

  }

}


/* =========================================================
   FIND VALUE
========================================================= */

function findFirstValue(
  obj,
  keys
){

  if(
    !obj ||
    typeof obj !== "object"
  ){

    return null;

  }


  for(
    const key of keys
  ){

    if(

      Object.prototype
        .hasOwnProperty
        .call(obj, key)

      &&

      obj[key] !== null

      &&

      obj[key] !== undefined

      &&

      obj[key] !== ""

    ){

      return obj[key];

    }

  }


  for(
    const key of Object.keys(obj)
  ){

    const value =
      obj[key];

    if(
      value &&
      typeof value === "object"
    ){

      const result =
        findFirstValue(
          value,
          keys
        );

      if(
        result !== null
      ){

        return result;

      }

    }

  }


  return null;

}


/* =========================================================
   VIDEO DATA
========================================================= */

function extractVideoData(raw){

  const videoUrl =
    findFirstValue(
      raw,
      [

        "play",
        "play_addr",
        "playUrl",
        "video_url",
        "videoUrl",
        "wmplay",
        "wm_play",
        "download_url",
        "downloadUrl"

      ]
    );


  const cover =
    findFirstValue(
      raw,
      [

        "cover",
        "origin_cover",
        "dynamic_cover",
        "thumbnail",
        "thumbnail_url"

      ]
    );


  const authorName =
    findFirstValue(
      raw,
      [

        "nickname",
        "author_name",
        "authorName",
        "name"

      ]
    );


  const username =
    findFirstValue(
      raw,
      [

        "unique_id",
        "uniqueId",
        "username",
        "author_unique_id",
        "authorUsername"

      ]
    );


  const caption =
    findFirstValue(
      raw,
      [

        "title",
        "desc",
        "description",
        "caption"

      ]
    );


  const likes =
    findFirstValue(
      raw,
      [

        "digg_count",
        "diggCount",
        "likes",
        "like_count"

      ]
    );


  const comments =
    findFirstValue(
      raw,
      [

        "comment_count",
        "commentCount",
        "comments"

      ]
    );


  const shares =
    findFirstValue(
      raw,
      [

        "share_count",
        "shareCount",
        "shares"

      ]
    );


  const views =
    findFirstValue(
      raw,
      [

        "play_count",
        "playCount",
        "views",
        "view_count"

      ]
    );


  return {

    videoUrl:
      typeof videoUrl === "string"
        ? videoUrl
        : "",

    cover:
      typeof cover === "string"
        ? cover
        : "",

    authorName:
      typeof authorName === "string"
        ? authorName
        : "TikTok User",

    username:
      typeof username === "string"
        ? username
        : "",

    caption:
      typeof caption === "string"
        ? caption
        : "",

    likes:
      Number(likes || 0),

    comments:
      Number(comments || 0),

    shares:
      Number(shares || 0),

    views:
      Number(views || 0)

  };

}


/* =========================================================
   TIKWM
========================================================= */

async function tikwmRequest(
  path,
  params
){

  const config =
    getConfig();


  const base =

    (
      config.TIKWM_API ||

      "https://www.tikwm.com/api"

    ).replace(
      /\/+$/,
      ""
    );


  const url =
    new URL(

      base +
      "/" +
      path.replace(
        /^\/+/,
        ""
      )

    );


  Object.entries(
    params || {}
  ).forEach(
    ([key, value]) => {

      if(

        value !== undefined &&

        value !== null

      ){

        url.searchParams.set(
          key,
          String(value)
        );

      }

    }
  );


  let response;

  try{

    response =
      await fetch(
        url.toString(),
        {
          method: "GET"
        }
      );

  }catch(error){

    throw new Error(
      "Tidak bisa menghubungi TikWM. " +
      "Kemungkinan CORS."
    );

  }


  if(!response.ok){

    throw new Error(

      "TikWM HTTP " +

      response.status +

      " - " +

      response.statusText

    );

  }


  const json =
    await response.json();


  if(

    json &&

    typeof json === "object" &&

    json.code !== undefined &&

    Number(json.code) !== 0

  ){

    throw new Error(

      "TikWM: " +

      (
        json.msg ||
        "request gagal"
      )

    );

  }


  return json;

}


/* =========================================================
   ARRAY RESPONSE
========================================================= */

function getArrayFromResponse(json){

  if(!json){
    return [];
  }


  const possible = [

    json?.data?.comments,

    json?.data?.comment,

    json?.comments,

    json?.data?.list,

    json?.list

  ];


  for(
    const item of possible
  ){

    if(
      Array.isArray(item)
    ){

      return item;

    }

  }


  return [];

}


/* =========================================================
   COMMENTS
========================================================= */

async function fetchComments(
  videoUrl
){

  const results = [];

  let cursor = 0;

  const config =
    getConfig();

  const maxComments =
    Number(
      config.MAX_COMMENTS || 100
    );

  let page = 0;


  while(

    results.length <
      maxComments &&

    page < 10

  ){

    page++;


    const json =
      await tikwmRequest(

        "comment/list",

        {

          url:
            videoUrl,

          count:
            Math.min(
              50,
              maxComments -
              results.length
            ),

          cursor:
            cursor

        }

      );


    const comments =
      getArrayFromResponse(
        json
      );


    if(
      !comments.length
    ){

      break;

    }


    results.push(
      ...comments
    );


    const data =
      json?.data ||
      json ||
      {};


    const hasMore =
      Boolean(

        data.hasMore ??

        data.has_more ??

        false

      );


    const nextCursor =
      data.cursor;


    if(

      !hasMore ||

      nextCursor === undefined ||

      nextCursor === cursor

    ){

      break;

    }


    cursor =
      nextCursor;


    setProgress(

      Math.min(

        55,

        25 +
        Math.round(

          results.length /
          maxComments *
          30

        )

      ),

      "COMMENTS",

      `Mengambil komentar... ${results.length}`

    );

  }


  return results.slice(
    0,
    maxComments
  );

}


/* =========================================================
   COMMENT ID
========================================================= */

function getCommentId(
  comment
){

  return (

    comment?.id ||

    comment?.cid ||

    comment?.comment_id ||

    comment?.commentId ||

    ""

  );

}


/* =========================================================
   REPLY TOTAL
========================================================= */

function getReplyTotal(
  comment
){

  return Number(

    comment?.reply_total ??

    comment?.replyTotal ??

    comment?.reply_comment_total ??

    comment?.reply_count ??

    comment?.replyCount ??

    0

  );

}


/* =========================================================
   FETCH REPLIES
========================================================= */

async function fetchRepliesForComment(
  comment
){

  const commentId =
    getCommentId(
      comment
    );


  if(!commentId){
    return [];
  }


  const total =
    getReplyTotal(
      comment
    );


  if(total <= 0){
    return [];
  }


  const config =
    getConfig();


  const results = [];

  let cursor = 0;

  let page = 0;

  const maxReplies =
    Number(
      config.MAX_REPLIES_PER_COMMENT ||
      50
    );


  while(

    results.length <
      maxReplies &&

    page < 5

  ){

    page++;


    const json =
      await tikwmRequest(

        "comment/reply",

        {

          comment_id:
            commentId,

          count:
            Math.min(
              50,
              maxReplies -
              results.length
            ),

          cursor:
            cursor

        }

      );


    const replies =
      getArrayFromResponse(
        json
      );


    if(
      !replies.length
    ){

      break;

    }


    results.push(
      ...replies
    );


    const data =
      json?.data ||
      json ||
      {};


    const hasMore =
      Boolean(

        data.hasMore ??

        data.has_more ??

        false

      );


    const nextCursor =
      data.cursor;


    if(

      !hasMore ||

      nextCursor === undefined ||

      nextCursor === cursor

    ){

      break;

    }


    cursor =
      nextCursor;

  }


  return results.slice(
    0,
    maxReplies
  );

}


/* =========================================================
   ALL REPLIES
========================================================= */

async function fetchAllReplies(
  comments
){

  const allReplies = [];

  let processed = 0;


  for(
    const comment of comments
  ){

    processed++;


    const total =
      getReplyTotal(
        comment
      );


    setProgress(

      55 +

      Math.round(

        processed /
        Math.max(
          comments.length,
          1
        ) *
        20

      ),

      "REPLIES",

      `Mencari replies ${processed}/${comments.length} • ${total} reply`

    );


    if(total <= 0){
      continue;
    }


    try{

      const replies =
        await fetchRepliesForComment(
          comment
        );


      replies.forEach(
        reply => {

          allReplies.push({

            ...reply,

            parentCommentId:
              getCommentId(
                comment
              )

          });

        }
      );


    }catch(error){

      console.warn(
        "Reply gagal:",
        error
      );

    }


    await sleep(80);

  }


  return allReplies;

}


/* =========================================================
   COMMENT TEXT
========================================================= */

function getCommentText(
  comment
){

  return normalizeText(

    comment?.text ||

    comment?.content ||

    comment?.desc ||

    ""

  );

}


/* =========================================================
   RECURSIVE STRING SCAN
========================================================= */

function collectStrings(
  value,
  output,
  depth = 0
){

  if(depth > 8){
    return;
  }


  if(
    typeof value === "string"
  ){

    const text =
      value.trim();


    if(text){
      output.push(text);
    }


    return;

  }


  if(
    Array.isArray(value)
  ){

    for(
      const item of value
    ){

      collectStrings(
        item,
        output,
        depth + 1
      );

    }


    return;

  }


  if(
    value &&
    typeof value === "object"
  ){

    for(
      const key of Object.keys(
        value
      )
    ){

      collectStrings(

        value[key],

        output,

        depth + 1

      );

    }

  }

}


/* =========================================================
   URL EXTRACTION
========================================================= */

function extractUrls(
  text
){

  if(!text){
    return [];
  }


  const matches =

    text.match(
      /https?:\/\/[^\s<>"'`]+/gi
    ) || [];


  return matches.map(
    url =>

      url.replace(
        /[),.!?;:'"\]}]+$/g,
        ""
      )

  );

}


/* =========================================================
   PRESET DETECTOR
========================================================= */

function looksLikePresetUrl(
  url
){

  const lower =
    url.toLowerCase();


  const keywords = [

    "alightmotion",

    "alight-motion",

    "alight motion",

    "alightmotion.com",

    "preset",

    ".xml",

    "xml",

    "amshare",

    "am-preset",

    "alight.link"

  ];


  return keywords.some(
    keyword =>
      lower.includes(
        keyword
      )
  );

}


/* =========================================================
   FIND PRESETS
========================================================= */

function findPresetLinks(

  videoRaw,

  videoData,

  comments,

  replies

){

  const found = [];

  const seen =
    new Set();


  function addFromText(
    text,
    source
  ){

    const urls =
      extractUrls(
        text
      );


    for(
      const url of urls
    ){

      if(
        !looksLikePresetUrl(
          url
        )
      ){

        continue;

      }


      if(
        url
          .toLowerCase()
          .includes(
            "tiktok.com"
          )
      ){

        continue;

      }


      const normalized =
        url.replace(
          /[?#].*$/,
          ""
        );


      const key =
        normalized.toLowerCase();


      if(
        seen.has(key)
      ){

        continue;

      }


      seen.add(key);


      found.push({

        url:

          url,

        source:

          source

      });

    }

  }


  /* VIDEO METADATA */

  const rawStrings = [];

  collectStrings(
    videoRaw,
    rawStrings
  );


  rawStrings.forEach(
    text => {

      addFromText(
        text,
        "Video metadata"
      );

    }
  );


  /* CAPTION */

  addFromText(

    videoData.caption,

    "Caption"

  );


  /* COMMENTS */

  comments.forEach(

    (comment, index) => {

      addFromText(

        getCommentText(
          comment
        ),

        `Comment #${index + 1}`

      );

    }

  );


  /* REPLIES */

  replies.forEach(

    (reply, index) => {

      addFromText(

        getCommentText(
          reply
        ),

        `Reply #${index + 1}`

      );

    }

  );


  return found;

}


/* =========================================================
   RENDER VIDEO
========================================================= */

function renderVideo(
  data
){

  $("authorName")
    .textContent =

      data.authorName ||
      "TikTok User";


  $("authorUsername")
    .textContent =

      data.username

        ? "@" +
          data.username
            .replace(
              /^@/,
              ""
            )

        : "@unknown";


  $("caption")
    .textContent =

      data.caption ||
      "(tanpa caption)";


  $("statLikes")
    .textContent =

      "❤️ " +
      formatNumber(
        data.likes
      );


  $("statComments")
    .textContent =

      "💬 " +
      formatNumber(
        data.comments
      );


  $("statShares")
    .textContent =

      "↗️ " +
      formatNumber(
        data.shares
      );


  $("statViews")
    .textContent =

      "👁️ " +
      formatNumber(
        data.views
      );


  const video =
    $("videoPlayer");


  if(data.videoUrl){

    video.src =
      data.videoUrl;

  }else{

    video.removeAttribute(
      "src"
    );

  }


  const download =
    $("downloadVideo");


  if(data.videoUrl){

    download.href =
      data.videoUrl;

    download.style.display =
      "inline-block";

  }else{

    download.style.display =
      "none";

  }

}


/* =========================================================
   RENDER PRESETS
========================================================= */

function renderPresets(
  presets
){

  const list =
    $("presetList");


  $("presetCount")
    .textContent =

      presets.length +
      " LINK";


  if(!presets.length){

    list.innerHTML = `

      <div class="empty">

        Tidak ditemukan link preset dari
        caption, komentar, reply, atau metadata.

      </div>

    `;

    return;

  }


  list.innerHTML =

    presets.map(
      (preset, index) => {

        const safeUrl =
          JSON.stringify(
            preset.url
          );


        return `

          <div class="preset">

            <div class="preset-top">

              <div class="preset-number">

                ${index + 1}

              </div>

              <div class="preset-body">

                <div class="preset-name">

                  Preset / Alight Motion Link

                </div>

                <div class="preset-source">

                  Sumber:
                  ${escapeHtml(
                    preset.source
                  )}

                </div>

                <div class="preset-url">

                  ${escapeHtml(
                    preset.url
                  )}

                </div>

              </div>

            </div>

            <div class="preset-actions">

              <button
                class="action open"
                onclick='openPreset(${safeUrl})'
              >

                BUKA PRESET

              </button>

              <button
                class="action"
                onclick='copyPreset(${safeUrl})'
              >

                COPY LINK

              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================================================
   OPEN PRESET
========================================================= */

function openPreset(
  url
){

  window.open(
    url,
    "_blank",
    "noopener"
  );

}


/* =========================================================
   COPY PRESET
========================================================= */

async function copyPreset(
  url
){

  try{

    await navigator
      .clipboard
      .writeText(
        url
      );

    alert(
      "Link preset berhasil dicopy."
    );

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      url;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    alert(
      "Link preset berhasil dicopy."
    );

  }

}


/* =========================================================
   MAIN SCANNER
========================================================= */

async function startScan(){

  clearError();


  $("result")
    .classList.remove(
      "show"
    );


  $("debugBox")
    .classList.remove(
      "show"
    );


  state.comments = [];

  state.replies = [];

  state.allTexts = [];

  state.presets = [];

  state.videoData = null;


  const url =
    $("tiktokUrl")
      .value
      .trim();


  if(!url){

    showError(
      "Masukkan link TikTok terlebih dahulu."
    );

    return;

  }


  if(!isTikTokUrl(url)){

    showError(
      "Link tidak terlihat seperti URL TikTok yang valid."
    );

    return;

  }


  const button =
    $("scanButton");


  button.disabled =
    true;


  button.textContent =
    "SCANNING...";


  try{

    state.originalUrl =
      url;


    /* =========================
       VIDEO
    ========================= */

    activateStep(
      "Video"
    );


    setProgress(

      8,

      "VIDEO",

      "Mengambil data video TikTok..."

    );


    const rawVideo =
      await fetchTikTokVideo(
        url
      );


    const videoData =
      extractVideoData(
        rawVideo
      );


    state.videoData =
      videoData;


    renderVideo(
      videoData
    );


    /* =========================
       COMMENTS
    ========================= */

    activateStep(
      "Comments"
    );


    setProgress(

      28,

      "COMMENTS",

      "Mengambil komentar TikTok..."

    );


    let comments = [];


    try{

      comments =
        await fetchComments(
          url
        );

    }catch(error){

      console.warn(
        "Comment API gagal:",
        error
      );


      $("commentsInfo")
        .textContent =

          "Komentar tidak dapat diambil: " +
          error.message;

    }


    state.comments =
      comments;


    /* =========================
       REPLIES
    ========================= */

    activateStep(
      "Replies"
    );


    let replies = [];


    if(
      comments.length
    ){

      replies =
        await fetchAllReplies(
          comments
        );

    }


    state.replies =
      replies;


    /* =========================
       SCAN
    ========================= */

    activateStep(
      "Scan"
    );


    setProgress(

      80,

      "SCAN",

      "Memindai caption, komentar, replies, dan metadata..."

    );


    const presets =
      findPresetLinks(

        rawVideo,

        videoData,

        comments,

        replies

      );


    state.presets =
      presets;


    /* =========================
       RENDER
    ========================= */

    renderPresets(
      presets
    );


    $("commentsInfo")
      .innerHTML = `

        Video berhasil diambil.<br>

        Komentar dipindai:
        <b>${comments.length}</b><br>

        Replies dipindai:
        <b>${replies.length}</b><br>

        Link preset ditemukan:
        <b>${presets.length}</b>

      `;


    /* =========================
       DONE
    ========================= */

    activateStep(
      "Done"
    );


    setProgress(

      100,

      "DONE",

      "Scanning selesai."

    );


    $("result")
      .classList.add(
        "show"
      );


  }catch(error){

    console.error(
      error
    );


    showError(

      "Scanner gagal: " +
      error.message

    );


    setProgress(

      0,

      "ERROR",

      "Scanning gagal."

    );


  }finally{

    button.disabled =
      false;

    button.textContent =
      "SCAN";

  }

}


/* =========================================================
   ENTER
========================================================= */

$("tiktokUrl")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        startScan();

      }

    }
  );

</script>
