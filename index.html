<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Preset Hunter</title>

  <meta
    name="description"
    content="Scan video TikTok untuk menemukan link preset Alight Motion."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07080d;
      --panel: rgba(20, 22, 31, 0.78);
      --panel2: rgba(28, 31, 43, 0.72);
      --border: rgba(255,255,255,0.10);
      --text: #f5f7ff;
      --muted: #969bad;
      --accent: #8b5cf6;
      --accent2: #a855f7;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(139,92,246,.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(168,85,247,.13),
          transparent 30%
        ),
        linear-gradient(135deg, #05060a, #0a0b12 50%, #05060a);
      padding: 20px;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(960px, 100%);
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      padding: 38px 15px 25px;
    }

    .logo {
      width: 74px;
      height: 74px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background:
        linear-gradient(
          135deg,
          rgba(139,92,246,.95),
          rgba(168,85,247,.65)
        );

      box-shadow:
        0 15px 45px rgba(139,92,246,.35);

      font-size: 35px;
    }

    h1 {
      font-size: clamp(30px, 6vw, 52px);
      font-weight: 900;
      letter-spacing: -1.8px;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .input-label {
      display: block;
      margin-bottom: 10px;
      color: #d7d9e4;
      font-size: 13px;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .input-wrap {
      position: relative;
      flex: 1;
    }

    input[type="url"] {
      width: 100%;
      height: 54px;

      padding: 0 16px;

      border: 1px solid rgba(255,255,255,.10);
      border-radius: 15px;

      outline: none;

      color: white;
      background: rgba(0,0,0,.28);

      transition: .2s;
    }

    input[type="url"]:focus {
      border-color: rgba(139,92,246,.7);
      box-shadow: 0 0 0 4px rgba(139,92,246,.10);
    }

    input::placeholder {
      color: #656979;
    }

    .scan-btn {
      height: 54px;
      padding: 0 24px;

      border: 0;
      border-radius: 15px;

      color: white;
      font-weight: 800;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      box-shadow:
        0 10px 30px rgba(139,92,246,.25);

      transition: .2s;
    }

    .scan-btn:hover {
      transform: translateY(-1px);
      box-shadow:
        0 14px 35px rgba(139,92,246,.34);
    }

    .scan-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 14px 16px;

      border: 1px solid rgba(239,68,68,.25);
      border-radius: 14px;

      color: #fecaca;
      background: rgba(239,68,68,.10);

      line-height: 1.5;
      font-size: 13px;
    }

    .error.show {
      display: block;
    }

    .progress-card {
      display: none;
      margin-top: 18px;
    }

    .progress-card.show {
      display: block;
    }

    .progress-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-bottom: 20px;
    }

    .progress-title strong {
      font-size: 15px;
    }

    .progress-percent {
      color: #bca7ff;
      font-weight: 800;
    }

    .progress-line {
      width: 100%;
      height: 7px;

      overflow: hidden;

      border-radius: 99px;
      background: rgba(255,255,255,.07);
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          var(--accent),
          #c084fc
        );

      transition: width .35s ease;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;

      margin-top: 22px;
    }

    .step {
      text-align: center;
      color: #646877;
      font-size: 11px;
      font-weight: 700;
    }

    .step-icon {
      width: 34px;
      height: 34px;

      margin: 0 auto 7px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(255,255,255,.06);

      font-size: 13px;
    }

    .step.active {
      color: #c4b5fd;
    }

    .step.active .step-icon {
      background: rgba(139,92,246,.22);
      color: #c4b5fd;
      box-shadow: 0 0 0 5px rgba(139,92,246,.07);
    }

    .step.done {
      color: #86efac;
    }

    .step.done .step-icon {
      background: rgba(34,197,94,.16);
      color: #86efac;
    }

    .result {
      display: none;
      margin-top: 18px;
    }

    .result.show {
      display: block;
    }

    .video-section {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
    }

    .video-box {
      position: relative;

      min-height: 300px;

      overflow: hidden;

      border-radius: 18px;

      background: #000;
    }

    .video-box video {
      width: 100%;
      height: 100%;

      min-height: 300px;

      display: block;

      object-fit: cover;
    }

    .video-cover {
      width: 100%;
      height: 100%;

      min-height: 300px;

      object-fit: cover;
      display: block;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .creator {
      display: flex;
      align-items: center;
      gap: 12px;

      margin-bottom: 15px;
    }

    .avatar {
      width: 46px;
      height: 46px;

      border-radius: 50%;

      object-fit: cover;

      background:
        linear-gradient(
          135deg,
          #8b5cf6,
          #ec4899
        );
    }

    .creator-name {
      font-weight: 800;
    }

    .creator-username {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .caption {
      color: #d7d9e4;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 16px;
    }

    .stat {
      padding: 7px 10px;

      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;

      color: #aeb2c1;
      background: rgba(255,255,255,.035);

      font-size: 11px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: max-content;

      margin-top: 18px;
      padding: 11px 16px;

      border-radius: 12px;

      color: white;
      background: rgba(255,255,255,.08);

      border: 1px solid rgba(255,255,255,.08);

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;
    }

    .download-btn:hover {
      background: rgba(255,255,255,.13);
    }

    .section {
      margin-top: 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 900;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .preset-list {
      display: grid;
      gap: 10px;
    }

    .preset {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 14px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 15px;

      background: rgba(255,255,255,.035);
    }

    .preset-icon {
      width: 42px;
      height: 42px;

      flex: 0 0 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      color: #ddd6fe;

      background: rgba(139,92,246,.14);

      font-size: 18px;
    }

    .preset-content {
      min-width: 0;
      flex: 1;
    }

    .preset-name {
      font-weight: 800;
      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-url {
      margin-top: 4px;

      color: #777b8b;

      font-size: 11px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-actions {
      display: flex;
      gap: 7px;
    }

    .small-btn {
      padding: 9px 11px;

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;

      color: #ddd;
      background: rgba(255,255,255,.05);

      cursor: pointer;

      font-size: 11px;
      font-weight: 800;
    }

    .small-btn:hover {
      background: rgba(255,255,255,.10);
    }

    .empty {
      padding: 25px;

      text-align: center;

      border: 1px dashed rgba(255,255,255,.10);
      border-radius: 15px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }

    .scan-info {
      margin-top: 14px;

      padding: 12px 14px;

      border-radius: 12px;

      color: #8f93a3;
      background: rgba(255,255,255,.025);

      font-size: 11px;
      line-height: 1.5;
    }

    .footer {
      padding: 30px 10px 15px;

      text-align: center;

      color: #565a68;

      font-size: 11px;
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translate(-50%, 20px);

      opacity: 0;
      pointer-events: none;

      padding: 11px 16px;

      border-radius: 12px;

      color: white;
      background: #1b1d27;

      border: 1px solid rgba(255,255,255,.10);

      box-shadow: 0 15px 40px rgba(0,0,0,.4);

      font-size: 12px;
      font-weight: 700;

      transition: .25s;

      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }

      .hero {
        padding-top: 25px;
      }

      .input-row {
        flex-direction: column;
      }

      .scan-btn {
        width: 100%;
      }

      .steps {
        grid-template-columns: repeat(5, 1fr);
      }

      .step {
        font-size: 9px;
      }

      .step-icon {
        width: 30px;
        height: 30px;
      }

      .video-section {
        grid-template-columns: 1fr;
      }

      .video-box {
        min-height: 420px;
      }

      .video-box video,
      .video-cover {
        min-height: 420px;
      }

      .preset {
        align-items: flex-start;
      }

      .preset-actions {
        flex-direction: column;
      }

      .small-btn {
        white-space: nowrap;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="logo">
        ⚡
      </div>

      <h1>Preset Hunter</h1>

      <p class="subtitle">
        Cari preset Alight Motion dari video TikTok
      </p>

    </header>


    <main>

      <!-- INPUT -->

      <section class="card">

        <label
          class="input-label"
          for="tiktokUrl"
        >
          LINK VIDEO TIKTOK
        </label>

        <div class="input-row">

          <div class="input-wrap">

            <input
              id="tiktokUrl"
              type="url"
              autocomplete="off"
              spellcheck="false"
              placeholder="https://www.tiktok.com/@user/video/..."
            >

          </div>

          <button
            id="scanButton"
            class="scan-btn"
            type="button"
            onclick="startScan()"
          >
            🔎 SCAN
          </button>

        </div>

        <div
          id="errorBox"
          class="error"
        ></div>

      </section>


      <!-- PROGRESS -->

      <section
        id="progressCard"
        class="card progress-card"
      >

        <div class="progress-title">

          <strong id="progressText">
            Mempersiapkan scanner...
          </strong>

          <span
            id="progressPercent"
            class="progress-percent"
          >
            0%
          </span>

        </div>

        <div class="progress-line">

          <div
            id="progressFill"
            class="progress-fill"
          ></div>

        </div>


        <div class="steps">

          <div
            id="stepVideo"
            class="step"
          >
            <div class="step-icon">▶</div>
            VIDEO
          </div>

          <div
            id="stepComments"
            class="step"
          >
            <div class="step-icon">💬</div>
            COMMENTS
          </div>

          <div
            id="stepReplies"
            class="step"
          >
            <div class="step-icon">↩</div>
            REPLIES
          </div>

          <div
            id="stepScan"
            class="step"
          >
            <div class="step-icon">🔍</div>
            SCAN
          </div>

          <div
            id="stepDone"
            class="step"
          >
            <div class="step-icon">✓</div>
            DONE
          </div>

        </div>

      </section>


      <!-- RESULT -->

      <section
        id="result"
        class="result"
      >

        <!-- VIDEO -->

        <div class="card">

          <div class="video-section">

            <div
              id="videoBox"
              class="video-box"
            ></div>


            <div class="video-info">

              <div class="creator">

                <img
                  id="avatar"
                  class="avatar"
                  alt="Avatar"
                  src=""
                  onerror="this.style.display='none'"
                >

                <div>

                  <div
                    id="creatorName"
                    class="creator-name"
                  >
                    -
                  </div>

                  <div
                    id="creatorUsername"
                    class="creator-username"
                  >
                    -
                  </div>

                </div>

              </div>


              <div
                id="caption"
                class="caption"
              ></div>


              <div
                id="stats"
                class="stats"
              ></div>


              <a
                id="downloadButton"
                class="download-btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >
                ⬇ BUKA VIDEO
              </a>

            </div>

          </div>

        </div>


        <!-- PRESETS -->

        <div class="card section">

          <div class="section-header">

            <div class="section-title">
              🎯 Preset ditemukan
            </div>

            <div
              id="presetCount"
              class="count"
            >
              0 link
            </div>

          </div>


          <div
            id="presetList"
            class="preset-list"
          ></div>


          <div
            id="scanInfo"
            class="scan-info"
          >
            Scanner akan mencari link preset dari caption,
            metadata video, komentar, dan reply komentar.
          </div>

        </div>

      </section>

    </main>


    <footer class="footer">
      Preset Hunter • TikWM scanner
    </footer>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <!--
    ============================================================
    CONFIG
    ============================================================

    Tidak membutuhkan RapidAPI.

    Endpoint utama:
    https://tikwm.com/api/

    config.js boleh ada, tetapi kalau tidak ada,
    scanner tetap menggunakan DEFAULT_CONFIG.
  -->

  <script src="config.js"></script>


  <script>

    /*
     * ============================================================
     * PRESET HUNTER
     * TIKWM VERSION
     * ============================================================
     */


    const DEFAULT_CONFIG = {

      TIKWM_API:
        "https://tikwm.com/api",

      MAX_COMMENTS:
        50,

      MAX_REPLIES_PER_COMMENT:
        20,

      REQUEST_DELAY_MS:
        1100

    };


    const APP_CONFIG = Object.assign(
      {},
      DEFAULT_CONFIG,
      window.CONFIG || {}
    );


    let lastRequestTime = 0;


    let currentPresets = [];


    /*
     * ============================================================
     * HELPERS
     * ============================================================
     */


    function sleep(ms) {

      return new Promise(
        resolve => {
          setTimeout(
            resolve,
            ms
          );
        }
      );

    }


    async function throttle() {

      const delay =
        Number(
          APP_CONFIG.REQUEST_DELAY_MS
        ) || 0;


      const now =
        Date.now();


      const elapsed =
        now - lastRequestTime;


      if (
        elapsed < delay
      ) {

        await sleep(
          delay - elapsed
        );

      }


      lastRequestTime =
        Date.now();

    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    function formatNumber(value) {

      const n =
        Number(value);


      if (
        !Number.isFinite(n)
      ) {

        return "0";

      }


      return new Intl.NumberFormat(
        "id-ID",
        {
          notation: "compact",
          maximumFractionDigits: 1
        }
      ).format(n);

    }


    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        showToast.timer
      );


      showToast.timer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          2200
        );

    }


    function showError(message) {

      const box =
        document.getElementById(
          "errorBox"
        );


      box.innerHTML =
        escapeHtml(
          message
        ).replace(
          /\n/g,
          "<br>"
        );


      box.classList.add(
        "show"
      );

    }


    function clearError() {

      const box =
        document.getElementById(
          "errorBox"
        );


      box.innerHTML =
        "";


      box.classList.remove(
        "show"
      );

    }


    function setProgress(
      percent,
      text
    ) {

      document.getElementById(
        "progressFill"
      ).style.width =
        `${percent}%`;


      document.getElementById(
        "progressPercent"
      ).textContent =
        `${percent}%`;


      document.getElementById(
        "progressText"
      ).textContent =
        text;

    }


    function setStep(
      step,
      state
    ) {

      const element =
        document.getElementById(
          `step${step}`
        );


      if (!element) {
        return;
      }


      element.classList.remove(
        "active",
        "done"
      );


      if (state) {

        element.classList.add(
          state
        );

      }

    }


    function resetSteps() {

      [
        "Video",
        "Comments",
        "Replies",
        "Scan",
        "Done"
      ].forEach(
        step => {

          setStep(
            step,
            ""
          );

        }
      );

    }


    /*
     * ============================================================
     * TIKTOK URL
     * ============================================================
     */


    function isTikTokUrl(
      value
    ) {

      try {

        const url =
          new URL(
            value
          );


        const host =
          url.hostname
            .toLowerCase()
            .replace(
              /^www\./,
              ""
            );


        return (
          host ===
            "tiktok.com" ||
          host.endsWith(
            ".tiktok.com"
          )
        );

      } catch {

        return false;

      }

    }


    /*
     * ============================================================
     * TIKWM REQUEST
     * ============================================================
     */


    async function tikwmRequest(
      endpoint,
      params
    ) {

      const base =
        String(
          APP_CONFIG.TIKWM_API ||
          DEFAULT_CONFIG.TIKWM_API
        ).replace(
          /\/+$/,
          ""
        );


      let url =
        `${base}/${endpoint || ""}`;


      const query =
        new URLSearchParams();


      Object.entries(
        params || {}
      ).forEach(
        ([key, value]) => {

          if (
            value !== undefined &&
            value !== null &&
            value !== ""
          ) {

            query.set(
              key,
              String(value)
            );

          }

        }
      );


      if (
        query.toString()
      ) {

        url +=
          `?${query.toString()}`;

      }


      await throttle();


      let response;


      try {

        response =
          await fetch(
            url,
            {
              method: "GET",
              cache: "no-store",
              headers: {
                "Accept":
                  "application/json"
              }
            }
          );

      } catch (error) {

        throw new Error(
          "Tidak bisa menghubungi TikWM dari browser. " +
          "Kemungkinan CORS atau koneksi internet."
        );

      }


      const raw =
        await response.text();


      let json;


      try {

        json =
          JSON.parse(
            raw
          );

      } catch {

        throw new Error(
          `TikWM mengembalikan response bukan JSON. HTTP ${response.status}`
        );

      }


      if (
        !response.ok
      ) {

        throw new Error(
          `TikWM HTTP ${response.status}: ` +
          `${
            json.msg ||
            raw
          }`
        );

      }


      if (
        json.code !== undefined &&
        Number(json.code) !== 0
      ) {

        throw new Error(
          json.msg ||
          "TikWM API gagal."
        );

      }


      return json;

    }

    /*
     * ============================================================
     * COMMENTS
     * ============================================================
     */


    async function fetchComments(
      tiktokUrl
    ) {

      const allComments =
        [];


      let cursor =
        0;


      let page =
        0;


      const maxComments =
        Math.max(
          1,
          Number(
            APP_CONFIG.MAX_COMMENTS
          ) || 50
        );


      while (
        allComments.length <
          maxComments &&
        page < 20
      ) {

        const remaining =
          maxComments -
          allComments.length;


        const count =
          Math.min(
            50,
            remaining
          );


        const response =
          await tikwmRequest(
            "comment/list",
            {
              url:
                tiktokUrl,

              count,

              cursor
            }
          );


        const data =
          response?.data ||
          {};


        const comments =
          Array.isArray(
            data.comments
          )
            ? data.comments
            : [];


        allComments.push(
          ...comments
        );


        page++;


        if (
          !data.hasMore ||
          !comments.length
        ) {

          break;

        }


        const nextCursor =
          data.cursor;


        if (
          nextCursor ===
            undefined ||
          nextCursor ===
            null ||
          String(
            nextCursor
          ) ===
            String(cursor)
        ) {

          break;

        }


        cursor =
          nextCursor;

      }


      return allComments.slice(
        0,
        maxComments
      );

    }


    /*
     * ============================================================
     * TEXT DARI COMMENT / REPLY
     * ============================================================
     */


    function commentText(
      comment

        !comment
      ) {

        ""
      );

    }


    /*
     * ============================================================
     * REPLY TOTAL
     * ============================================================
     */


    function getReplyTotal(
      comment
    ) {

      const possibleValues = [

        comment?.reply_total,

        comment?.replyTotal,

        comment?.reply_count,

        comment?.replyCount,

        comment?.total_reply,

        comment?.totalReply

      ];


      for (
        const value of
        possibleValues
      ) {

        const number =
          Number(value);


        if (
          Number.isFinite(number) &&
          number > 0
        ) {

          return number;

        }

      }


      /*
       * Beberapa struktur API
       * bisa mempunyai object replies.
       */

      const nested =
        extractNestedReplies(
          comment
        );


      return nested.length;

    }


    /*
     * ============================================================
     * NESTED REPLIES
     *
     * Sebagian response dapat mempunyai
     * reply langsung di dalam object comment.
     * ============================================================
     */


    function extractNestedReplies(
      comment
    ) {

      const result =
        [];


      const visited =
        new WeakSet();


      const replyFields = [

        "replies",

        "reply",

        "reply_comments",

        "replyComments",

        "reply_list",

        "replyList",

        "children",

        "sub_comments",

        "subComments"

      ];


      function walk(
        obj,
        depth
      ) {

        if (
          !obj ||
          typeof obj !== "object"
        ) {

          return;

        }


        if (
          depth > 8
        ) {

          return;

        }


        if (
          visited.has(obj)
        ) {

          return;

        }


        visited.add(obj);


        if (
          Array.isArray(obj)
        ) {

          obj.forEach(
            child => {

              walk(
                child,
                depth + 1
              );

            }
          );

          return;

        }


        replyFields.forEach(
          field => {

            const value =
              obj[field];


            if (
              Array.isArray(value)
            ) {

              value.forEach(
                item => {

                  if (
                    item &&
                    typeof item ===
                      "object"
                  ) {

                    result.push(
                      item
                    );

                    walk(
                      item,
                      depth + 1
                    );

                  }

                }
              );

            } else if (
              value &&
              typeof value ===
                "object"
            ) {

              result.push(
                value
              );

              walk(
                value,
                depth + 1
              );

            }

          }
        );

      }


      walk(
        comment,
        0
      );


      /*
       * Deduplicate reply object.
       */

      const unique =
        new Map();


      result.forEach(
        item => {

          const id =
            item?.id ||
            item?.cid ||
            item?.comment_id ||
            item?.commentId ||
            JSON.stringify(item);


          if (
            !unique.has(id)
          ) {

            unique.set(
              id,
              item
            );

          }

        }
      );


      return Array.from(
        unique.values()
      );

    }


    /*
     * ============================================================
     * REPLIES API
     * ============================================================
     */


    async function fetchReplies(
      comment
    ) {

      if (
        !comment
      ) {

        return [];

      }


      const commentId =
        comment.id ||
        comment.cid ||
        comment.comment_id ||
        comment.commentId ||
        "";


      const total =
        getReplyTotal(
          comment
        );


      /*
       * Kalau tidak punya ID,
       * gunakan nested replies kalau ada.
       */

      if (
        !commentId
      ) {

        return extractNestedReplies(
          comment
        );

      }


      /*
       * Jika reply_total = 0,
       * tetap cek nested reply.
       */

      if (
        total <= 0
      ) {

        return extractNestedReplies(
          comment
        );

      }


      const maxReplies =
        Math.min(
          total,
          Math.max(
            1,
            Number(
              APP_CONFIG.MAX_REPLIES_PER_COMMENT
            ) || 20
          )
        );


      const replies =
        [];


      let cursor =
        0;


      let page =
        0;


      while (
        replies.length <
          maxReplies &&
        page < 10
      ) {

        const remaining =
          maxReplies -
          replies.length;


        const count =
          Math.min(
            50,
            remaining
          );


        const response =
          await tikwmRequest(
            "comment/reply",
            {
              comment_id:
                commentId,

              count,

              cursor
            }
          );


        const data =
          response?.data ||
          {};


        const items =
          Array.isArray(
            data.comments
          )
            ? data.comments
            : [];


        replies.push(
          ...items
        );


        page++;


        if (
          !data.hasMore ||
          !items.length
        ) {

          break;

        }


        const nextCursor =
          data.cursor;


        if (
          nextCursor ===
            undefined ||
          nextCursor ===
            null ||
          String(
            nextCursor
          ) ===
            String(cursor)
        ) {

          break;

        }


        cursor =
          nextCursor;

      }


      /*
       * Gabungkan nested replies
       * bila ada.
       */

      const nested =
        extractNestedReplies(
          comment
        );


      replies.push(
        ...nested
      );


      /*
       * Deduplicate.
       */

      const unique =
        new Map();


      replies.forEach(
        item => {

          const id =
            item?.id ||
            item?.cid ||
            item?.comment_id ||
            item?.commentId ||
            JSON.stringify(item);


          if (
            !unique.has(id)
          ) {

            unique.set(
              id,
              item
            );

          }

        }
      );


      return Array.from(
        unique.values()
      ).slice(
        0,
        maxReplies
      );

    }


    /*
     * ============================================================
     * SCAN SEMUA STRING DALAM OBJECT
     * ============================================================
     */


    function scanObjectForUrls(
      object,
      source,
      addUrl
    ) {

      const visited =
        new WeakSet();


      function walk(
        value,
        currentSource
      ) {

        if (
          value === null ||
          value === undefined
        ) {

          return;

        }


        if (
          typeof value ===
          "string"
        ) {

          const urls =
            findUrls(
              value
            );


          urls.forEach(
            url => {

              addUrl(
                url,
                currentSource
              );

            }
          );


          return;

        }


        if (
          typeof value !==
          "object"
        ) {

          return;

        }


        if (
          visited.has(value)
        ) {

          return;

        }


        visited.add(
          value
        );


        if (
          Array.isArray(value)
        ) {

          value.forEach(
            item => {

              walk(
                item,
                currentSource
              );

            }
          );

          return;

        }


        Object.entries(
          value
        ).forEach(
          ([key, child]) => {

            let nextSource =
              currentSource;


            const lowerKey =
              String(key)
                .toLowerCase();


            if (
              lowerKey.includes(
                "caption"
              ) ||
              lowerKey ===
                "title" ||
              lowerKey ===
                "desc" ||
              lowerKey ===
                "description"
            ) {

              nextSource =
                "Caption / Metadata";

            }


            if (
              lowerKey.includes(
                "comment"
              )
            ) {

              nextSource =
                "Komentar";

            }


            if (
              lowerKey.includes(
                "reply"
              ) ||
              lowerKey.includes(
                "replies"
              )
            ) {

              nextSource =
                "Reply";

            }


            walk(
              child,
              nextSource
            );

          }
        );

      }


      walk(
        object,
        source
      );

    }


    /*
     * ============================================================
     * URL EXTRACTION
     * ============================================================
     */


    function findUrls(
      text
    ) {

      if (
        !text
      ) {

        return [];

      }


      const matches =
        String(text).match(
          /https?:\/\/[^\s<>"'`]+/gi
        ) || [];


      return matches
        .map(
          url => {

            return url
              .replace(
                /[)\]}>.,!?;:'"]+$/g,
                ""
              );

          }
        )
        .filter(Boolean);

    }


    /*
     * ============================================================
     * PRESET URL DETECTION
     * ============================================================
     */


    function isPresetUrl(
      value
    ) {

      const url =
        String(
          value || ""
        ).trim();


      if (
        !url
      ) {

        return false;

      }


      const lower =
        url.toLowerCase();


      /*
       * Jangan anggap TikTok sebagai preset.
       */

      if (
        lower.includes(
          "tiktok.com"
        ) ||
        lower.includes(
          "tiktokcdn.com"
        )
      ) {

        return false;

      }


      /*
       * Link resmi / umum
       * Alight Motion.
       */

      const presetKeywords = [

        "alightcreative.com",

        "alightmotion",

        "alight-motion",

        "alight motion",

        "alight.link",

        "amshare",

        "preset",

        ".xml",

        "project",

        "template",

        /*
         * Google Drive sering dipakai
         * untuk file XML.
         */

        "drive.google.com/file/",

        "drive.google.com/drive/"

      ];


      return presetKeywords.some(
        keyword =>
          lower.includes(
            keyword
          )
      );

    }


    /*
     * ============================================================
     * FIND PRESET LINKS
     *
     * Scan:
     * - Caption
     * - Metadata
     * - Comment
     * - Reply
     * - Semua nested object
     * ============================================================
     */


    function findPresetLinks(
      videoData,
      comments,
      replies
    ) {

      const found =
        new Map();


      function addUrl(
        url,
        source
      ) {

        if (
          !url
        ) {

          return;

        }


        let clean =
          String(
            url
          )
            .trim()
            .replace(
              /[)\]}>.,!?;:'"]+$/g,
              ""
            );


        if (
          !clean
        ) {

          return;

        }


        if (
          !isPresetUrl(
            clean
          )
        ) {

          return;

        }


        const key =
          clean.toLowerCase();


        if (
          !found.has(key)
        ) {

          found.set(
            key,
            {
              url:
                clean,

              source:
                source
            }
          );

        }

      }


      /*
       * Caption.
       */

      addUrlFromText(
        videoData?.title,
        "Caption",
        addUrl
      );


      /*
       * Semua metadata video.
       */

      scanObjectForUrls(
        videoData?.raw || {},
        "Metadata",
        addUrl
      );


      /*
       * Semua comment object.
       *
       * Ini penting karena link bisa berada
       * bukan di comment.text saja.
       */

      comments.forEach(
        comment => {

          scanObjectForUrls(
            comment,
            "Komentar",
            addUrl
          );

        }
      );


      /*
       * Semua reply object.
       */

      replies.forEach(
        reply => {

          scanObjectForUrls(
            reply,
            "Reply",
            addUrl
          );

        }
      );


      return Array.from(
        found.values()
      );

    }


    function addUrlFromText(
      text,
      source,
      addUrl
    ) {

      if (
        !text
      ) {

        return;

      }


      findUrls(
        text
      ).forEach(
        url => {

          addUrl(
            url,
            source
          );

        }
      );

    }

    /*

     * OPEN PRESET
     * ============================================================
     */


    function openPreset(
      index
    ) {

      const preset =
        currentPresets[
          index
        ];


      if (
        !preset
      ) {

        return;

      }


      window.open(
        preset.url,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /*
     * ============================================================
     * COPY PRESET
     * ============================================================
     */


    async function copyPreset(
      index
    ) {

      const preset =
        currentPresets[
          index
        ];


      if (
        !preset
      ) {

        return;

      }


      try {

        await navigator.clipboard.writeText(
          preset.url
        );


        showToast(
          "Link preset berhasil dicopy."
        );

      } catch {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          preset.url;


        textarea.style.position =
          "fixed";


        textarea.style.opacity =
          "0";


        document.body.appendChild(
          textarea
        );


        textarea.select();


        document.execCommand(
          "copy"
        );


        textarea.remove();


        showToast(
          "Link preset berhasil dicopy."
        );

      }

    }


    /*
     * ============================================================
     * MAIN SCANNER
     * ============================================================
     */


    async function startScan() {

      clearError();


      const input =
        document.getElementById(
          "tiktokUrl"
        );


      const scanButton =
        document.getElementById(
          "scanButton"
        );


      const progressCard =
        document.getElementById(
          "progressCard"
        );


      const result =
        document.getElementById(
          "result"
        );


      const tiktokUrl =
        input.value.trim();


      if (
        !tiktokUrl
      ) {

        showError(
          "Masukkan link TikTok terlebih dahulu."
        );


        input.focus();


        return;

      }


      if (
        !isTikTokUrl(
          tiktokUrl
        )
      ) {

        showError(
          "Link yang dimasukkan bukan URL TikTok yang valid."
        );


        input.focus();


        return;

      }


      /*
       * Reset.
       */

      result.classList.remove(
        "show"
      );


      progressCard.classList.add(
        "show"
      );


      scanButton.disabled =
        true;


      scanButton.textContent =
        "SCANNING...";


      resetSteps();


      setProgress(
        2,
        "Menghubungi TikWM..."
      );


      currentPresets =
        [];


      let videoData =
        null;


      let comments =
        [];


      let replies =
        [];


      try {

        /*
         * ========================================================
         * STEP 1
         * VIDEO
         * ========================================================
         */

        setStep(
          "Video",
          "active"
        );


        setProgress(
          8,
          "Mengambil data video..."
        );


        const videoResponse =
          await fetchVideo(
            tiktokUrl
          );


        videoData =
          normalizeVideoData(
            videoResponse
          );


        renderVideo(
          videoData
        );


        setStep(
          "Video",
          "done"
        );


        setProgress(
          25,
          "Video berhasil diambil."
        );


        /*
         * ========================================================
         * STEP 2
         * COMMENTS
         * ========================================================
         */

        setStep(
          "Comments",
          "active"
        );


        setProgress(
          30,
          "Mengambil komentar..."
        );


        try {

          comments =
            await fetchComments(
              tiktokUrl
            );

        } catch (
          commentError
        ) {

          console.warn(
            "Comment fetch failed:",
            commentError
          );


          comments =
            [];


          document.getElementById(
            "scanInfo"
          ).textContent =
            "Video berhasil diambil, tetapi komentar tidak berhasil diakses: " +
            commentError.message;

        }


        setStep(
          "Comments",
          "done"
        );


        setProgress(
          45,
          `${comments.length} komentar berhasil diambil.`
        );


        /*
         * ========================================================
         * STEP 3
         * REPLIES
         * ========================================================
         */

        setStep(
          "Replies",
          "active"
        );


        setProgress(
          48,
          "Mencari reply komentar..."
        );


        /*
         * Pertama ambil nested reply yang sudah
         * berada di object komentar.
         */

        for (
          const comment of
          comments
        ) {

          const nestedReplies =
            extractNestedReplies(
              comment
            );


          if (
            nestedReplies.length
          ) {

            replies.push(
              ...nestedReplies
            );

          }

        }


        /*
         * Kemudian panggil endpoint
         * comment/reply.
         *
         * Sequential agar tidak membanjiri API.
         */

        for (
          let i = 0;
          i < comments.length;
          i++
        ) {

          const comment =
            comments[i];


          const replyTotal =
            getReplyTotal(
              comment
            );


          const commentId =
            comment?.id ||
            comment?.cid ||
            comment?.comment_id ||
            comment?.commentId ||
            "";


          if (
            replyTotal > 0 &&
            commentId
          ) {

            try {

              const foundReplies =
                await fetchReplies(
                  comment
                );


              replies.push(
                ...foundReplies
              );

            } catch (
              replyError
            ) {

              console.warn(
                "Reply fetch failed:",
                replyError
              );

            }

          }


          const progress =
            48 +
            Math.round(
              (
                (i + 1) /
                Math.max(
                  comments.length,
                  1
                )
              ) * 27
            );


          setProgress(
            progress,
            `Membaca reply ${i + 1}/${comments.length}...`
          );

        }


        /*
         * Deduplicate semua reply.
         */

        const uniqueReplies =
          new Map();


        replies.forEach(
          reply => {

            const id =
              reply?.id ||
              reply?.cid ||
              reply?.comment_id ||
              reply?.commentId ||
              JSON.stringify(
                reply
              );


            if (
              !uniqueReplies.has(
                id
              )
            ) {

              uniqueReplies.set(
                id,
                reply
              );

            }

          }
        );


        replies =
          Array.from(
            uniqueReplies.values()
          );


        setStep(
          "Replies",
          "done"
        );


        /*
         * ========================================================
         * STEP 4
         * SCAN
         * ========================================================
         */

        setStep(
          "Scan",
          "active"
        );


        setProgress(
          80,
          "Memindai link preset..."
        );


        currentPresets =
          findPresetLinks(
            videoData,
            comments,
            replies
          );


        renderPresets(
          currentPresets
        );


        document.getElementById(
          "scanInfo"
        ).textContent =
          `Selesai memindai: ` +
          `${comments.length} komentar + ` +
          `${replies.length} reply. ` +
          `Ditemukan ${currentPresets.length} link preset.`;


        setStep(
          "Scan",
          "done"
        );


        setProgress(
          95,
          "Menampilkan hasil..."
        );


        /*
         * ========================================================
         * DONE
         * ========================================================
         */

        setStep(
          "Done",
          "done"
        );


        setProgress(
          100,
          "Scan selesai."
        );


        result.classList.add(
          "show"
        );


        setTimeout(
          () => {

            result.scrollIntoView(
              {
                behavior:
                  "smooth",

                block:
                  "start"
              }
            );

          },
          150
        );


      } catch (
        error
      ) {

        console.error(
          error
        );


        setProgress(
          100,
          "Scanner gagal."
        );


        const message =
          String(
            error?.message ||
            error ||
            "Unknown error"
          );


        if (
          message
            .toLowerCase()
            .includes("cors") ||
          message
            .toLowerCase()
            .includes("browser")
        ) {

          showError(
            "Scanner gagal karena browser tidak dapat mengakses TikWM. " +
            "Periksa koneksi/CORS endpoint TikWM."
          );

        } else {

          showError(
            "Scanner gagal: " +
            message
          );

        }

      } finally {

        scanButton.disabled =
          false;


        scanButton.textContent =
          "🔎 SCAN";

      }

    }


    /*
     * ============================================================
     * ENTER KEY
     * ============================================================
     */


    document
      .getElementById(
        "tiktokUrl"
      )
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key ===
            "Enter"
          ) {

            startScan();

          }

        }
      );


    /*
     * ============================================================
     * PASTE HANDLER
     * ============================================================
     */


    document
      .getElementById(
        "tiktokUrl"
      )
      .addEventListener(
        "paste",
        () => {

          clearError();

        }
      );

  </script>

</body>
</html>
